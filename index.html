<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Analyse Patrimoniale — ADC Patrimoine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --gold: #C8963E;
  --gold-light: #F0C060;
  --gold-dark: #A06820;
  --bg: #111112;
  --bg2: #1C1C1E;
  --bg3: #161618;
  --bg4: #222226;
  --text: #E8E8E8;
  --text2: #A0A8B4;
  --text3: #5A6070;
  --border: #2A2A2E;
  --green: #1B7A4A;
  --green-light: #4ABA7A;
  --red: #E05555;
  --blue: #4A8FE8;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; overflow-x: clip; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: clip;
  width: 100%;
  box-sizing: border-box;
}

/* BACKGROUND FX */
.bg-fx {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(200,150,62,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(200,150,62,0.05) 0%, transparent 60%);
}
.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* LAYOUT */
*, *::before, *::after { box-sizing: border-box; }
.wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 16px 80px; width: 100%; }

/* LOGO */
.logo-lockup {
  display: flex; align-items: center; gap: 12px;
}
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(200,150,62,0.3);
}
.logo-icon svg { width: 24px; height: 24px; }
.logo-text-wrap { display: flex; flex-direction: column; line-height: 1; }
.logo-main {
  font-size: 17px; font-weight: 900; letter-spacing: .04em;
  background: linear-gradient(90deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-sub {
  font-size: 10px; font-weight: 600; letter-spacing: .14em;
  color: var(--text2); text-transform: uppercase; margin-top: 2px;
}

/* HEADER */
header {
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(200,150,62,0.1); border: 1px solid rgba(200,150,62,0.3);
  border-radius: 20px; padding: 5px 14px; font-size: 11px; font-weight: 700;
  color: var(--gold-light); letter-spacing: .08em; text-transform: uppercase;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-light); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
.print-btn {
  background: rgba(200,150,62,0.12); border: 1px solid rgba(200,150,62,0.3);
  color: var(--gold-light); font-size: 12px; font-weight: 700;
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: all .2s;
  display: flex; align-items: center; gap: 7px; letter-spacing: .03em;
}
.print-btn:hover { background: rgba(200,150,62,0.22); border-color: var(--gold); }

/* CANDIDAT BANNER */
.candidat-banner {
  background: linear-gradient(135deg, #1A1A0E 0%, #1C1C1E 100%);
  border: 1px solid rgba(200,150,62,0.35);
  border-top: 3px solid var(--gold);
  border-radius: 12px; padding: 18px 20px;
  margin: 24px 0;
  position: relative; overflow: hidden;
}
.candidat-banner::before {
  content:''; position:absolute; top:-40px; right:-40px;
  width:180px; height:180px; border-radius:50%;
  background: radial-gradient(circle, rgba(200,150,62,0.08) 0%, transparent 70%);
  pointer-events:none;
}
.candidat-info h2 {
  font-size: 20px; font-weight: 800; color: #fff;
}
.candidat-info h2 span {
  background: linear-gradient(90deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.candidat-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600;
  color: var(--text2); letter-spacing: .03em; white-space: nowrap;
}
.tag.gold { border-color: rgba(200,150,62,0.4); color: var(--gold-light); background: rgba(200,150,62,0.08); }
.tag.green { border-color: rgba(75,186,122,0.4); color: var(--green-light); background: rgba(75,186,122,0.08); }
.score-box {
  text-align: center;
  background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px;
  flex-shrink: 0;
}
.score-val { font-size: 38px; font-weight: 900; line-height: 1; }
.score-label { font-size: 10px; font-weight: 700; color: var(--text3); margin-top: 4px; letter-spacing: .1em; text-transform: uppercase; }

/* Banner layout: desktop = side by side, mobile = stacked */
.banner-inner {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.banner-score-mobile {
  display: none;
}
@media (max-width: 540px) {
  .banner-inner { flex-direction: column; align-items: stretch; gap: 10px; }
  .score-box { display: none; }
  .banner-score-mobile {
    display: inline-flex; align-items: center; gap: 12px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; margin-top: 10px;
  }
  .banner-score-mobile .score-num {
    font-size: 36px; font-weight: 900; line-height: 1; flex-shrink: 0;
  }
  .banner-score-mobile .score-right {
    display: flex; flex-direction: column; gap: 1px;
  }
  .banner-score-mobile .score-right .s-label {
    font-size: 9px; font-weight: 700; color: var(--text3); letter-spacing: .12em; text-transform: uppercase;
  }
  .banner-score-mobile .score-right .s-sub {
    font-size: 13px; font-weight: 700; color: var(--text2);
  }
  .candidat-banner { padding: 14px 16px; }
  .score-val { font-size: 28px; }
  .candidat-tags { gap: 5px; }
  .tag { font-size: 10px; padding: 3px 8px; }
}

/* SECTION TITLES */
.section-title {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 32px 0 16px;
}
.section-title h3 {
  font-size: 13px; font-weight: 700; letter-spacing: .08em;
  color: var(--gold); text-transform: uppercase;
  white-space: normal; line-height: 1.4; min-width: 0; flex: 1;
}
@media (max-width: 600px) {
  .section-title h3 { font-size: 11px; letter-spacing: .05em; }
}
.section-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(200,150,62,0.15); border: 1px solid rgba(200,150,62,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--gold-light);
  flex-shrink: 0;
}
.section-line { flex: 1; height: 1px; background: var(--border); }

/* ADJUST SECTION */
.adjust-section {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 16px;
}
.adjust-section h4 {
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
}
.adjust-section h4::after { content:''; flex:1; height:1px; background: var(--border); }
.adjust-badge {
  font-size: 10px; font-weight: 600; color: var(--text2); background: var(--bg3);
  padding: 2px 9px; border-radius: 10px; border: 1px solid var(--border);
  letter-spacing: .04em; text-transform: none;
}
.adjust-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.adjust-label { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: .04em; text-transform: uppercase; }
.adjust-slider-wrap { display: flex; align-items: center; gap: 12px; width: 100%; }
.adjust-slider {
  flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
  background: linear-gradient(to right, var(--gold) 0%, var(--gold) var(--val, 20%), var(--border) var(--val, 20%), var(--border) 100%);
  touch-action: manipulation; min-width: 0;
}
.adjust-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--gold-light); border: 3px solid var(--bg); cursor: pointer;
  box-shadow: 0 0 12px rgba(240,192,96,0.5);
  transition: transform .1s, box-shadow .1s;
}
.adjust-slider::-webkit-slider-thumb:hover { transform: scale(1.15); box-shadow: 0 0 18px rgba(240,192,96,0.7); }
.adjust-slider::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--gold-light); border: 3px solid var(--bg); cursor: pointer;
  box-shadow: 0 0 12px rgba(240,192,96,0.5);
}
.adjust-input {
  flex-shrink: 0; width: 86px; background: var(--bg3); border: 1.5px solid var(--border); border-radius: 8px;
  padding: 7px 8px; color: var(--gold-light); font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 700; outline: none; text-align: center;
  transition: border-color .2s;
  -moz-appearance: textfield;
}
.adjust-input::-webkit-outer-spin-button,
.adjust-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.adjust-input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,150,62,0.15); }

/* CARDS GRID */
.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 580px) { .cards-grid { grid-template-columns: 1fr; display: flex; flex-direction: column; } }

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px;
}
.card-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.card-val { font-size: 26px; font-weight: 800; color: var(--gold-light); line-height: 1; font-family: 'DM Sans', sans-serif; }
.card-val.green { color: var(--green-light); }
.card-val.red { color: var(--red); }
.card-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }
.card-full { grid-column: 1 / -1; }

/* CHART CONTAINER */
.chart-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
  margin-bottom: 12px;
}
.chart-box h4 {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 16px;
}
.chart-wrap { position: relative; height: 220px; }

/* BUDGET BARS */
.budget-bar-wrap { margin-bottom: 10px; }
.budget-bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; gap: 4px; }
.budget-bar-label { font-size: 12px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
.budget-bar-val { font-size: 12px; font-weight: 700; color: var(--text); flex-shrink: 0; white-space: nowrap; }
.budget-bar-pct { font-size: 10px; font-weight: 600; color: var(--text3); margin-left: 6px; }
.budget-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.budget-bar-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
.budget-donut-wrap { flex:1; min-width:180px; max-width:220px; margin:0 auto; position:relative; height:180px; }
@media (max-width:580px) { .budget-donut-wrap { min-width:100%; max-width:260px; height:240px; margin:16px auto 0; } }
@media (max-width:540px) { .budget-donut-desktop { display:none !important; } }
.immo-toggle-arrow { display:none; }
@media (max-width:600px) { .immo-toggle-arrow { display:inline; } }

/* RANGE BAR */
.range-bar {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 18px; margin-bottom: 16px;
}
.range-title { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .08em; }
.range-track { height: 6px; background: var(--border); border-radius: 3px; position: relative; margin-bottom: 14px; }
.range-fill {
  position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
  transition: width .8s cubic-bezier(.4,0,.2,1);
}
.range-labels { display: flex; justify-content: space-between; align-items: flex-start; font-size: 12px; gap: 8px; }
.range-min { color: var(--text2); line-height: 1.4; }
.range-max { color: var(--gold-light); font-weight: 700; text-align: right; line-height: 1.4; }

/* INSIGHTS */
.insights { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.insight {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 12px;
}
.insight-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
.insight-text { font-size: 13px; color: var(--text2); line-height: 1.6; }
.insight-text strong { color: #fff; font-weight: 800; font-size: 14px; }
.insight.good { border-color: rgba(75,186,122,0.25); background: rgba(75,186,122,0.04); }
.insight.warn { border-color: rgba(200,150,62,0.25); background: rgba(200,150,62,0.04); }
.insight.info { border-color: rgba(74,143,232,0.2); background: rgba(74,143,232,0.04); }

/* RECOMMANDATIONS */
.reco-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 580px) { .reco-grid { grid-template-columns: 1fr; } }
.reco-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}
.reco-card h5 { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.reco-card p { font-size: 12px; color: var(--text2); line-height: 1.6; }

/* CTA FINAL */
.cta-section {
  background: linear-gradient(135deg, var(--bg2), #1A1A10);
  border: 1px solid rgba(200,150,62,0.3);
  border-radius: 12px; padding: 32px 28px; margin-top: 32px; text-align: center;
  position: relative; overflow: hidden;
}
.cta-section::before {
  content:''; position:absolute; top:-60px; right:-60px;
  width:220px; height:220px; border-radius:50%;
  background: radial-gradient(circle, rgba(200,150,62,0.1) 0%, transparent 70%);
}
.cta-section h3 {
  font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 8px;
}
.cta-section h3 span {
  background: linear-gradient(90deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.cta-section p { font-size: 14px; color: var(--text2); margin-bottom: 22px; line-height: 1.6; max-width: 540px; margin-left: auto; margin-right: auto; }
.cta-btn {
  display: block;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
  color: #111; font-weight: 800; font-size: 15px; font-family: 'DM Sans', sans-serif;
  padding: 16px 24px; border-radius: 10px; text-decoration: none;
  transition: transform .2s, box-shadow .2s;
  box-shadow: 0 4px 24px rgba(200,150,62,0.35);
  letter-spacing: .02em;
  white-space: nowrap;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
}
.cta-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(200,150,62,0.5); }
.cta-urgence { font-size: 11px; color: var(--text3); margin-top: 12px; text-align: center; }
.cta-urgence span { color: var(--green-light); font-weight: 700; }
@media (max-width: 540px) {
  .cta-urgence { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

/* DIVIDER */
.divider { height: 1px; background: var(--border); margin: 8px 0; }


/* LOGO IMAGE REAL */
.logo-img-real {
  height: 80px;
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
  display: block;
}

/* CTA PHOTO */
.cta-inner {
  display: flex; align-items: center; gap: 32px; text-align: left; position: relative; z-index: 1;
  flex-wrap: wrap;
}
.cta-photo-wrap {
  flex-shrink: 0; text-align: center;
}
.cta-photo {
  width: 110px; height: 110px; border-radius: 50%; object-fit: cover; object-position: top center;
  border: 2px solid rgba(200,150,62,0.5);
  box-shadow: 0 0 30px rgba(200,150,62,0.2);
  display: block; margin: 0 auto 8px;
}
.cta-photo-name {
  font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3;
}
.cta-photo-title {
  font-size: 11px; color: var(--gold-light); font-weight: 500; margin-top: 2px;
}
.cta-content { flex: 1; min-width: 240px; }
.cta-content h3 { text-align: left; }
.cta-content p { text-align: left; margin-left: 0; margin-right: 0; }
.cta-content .cta-urgence { text-align: left; }
@media (max-width: 540px) {
  .cta-inner { flex-direction: column; text-align: center; }
  .cta-content h3, .cta-content p, .cta-content .cta-urgence { text-align: center; }
}

/* MOBILE OVERFLOW FIX */
@media (max-width: 600px) {
  .wrap { padding: 0 12px 80px; }
  .candidat-info h2 { font-size: 17px; }
  .chart-box { padding: 14px; }
  header {
    padding: 14px 0 12px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: nowrap;
  }
  .logo-lockup {
    background: transparent;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: none;
    margin-bottom: 0;
    flex-shrink: 0;
    width: 100%;
  }
  .logo-img-real {
    height: 80px !important;
    background: transparent !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
  .header-right { gap: 8px; flex-wrap: nowrap; justify-content: center; flex-shrink: 0; width: 100%; }
  .header-badge { font-size: 11px; padding: 6px 12px; }
  .print-btn { font-size: 11px; padding: 6px 12px; }
  .print-btn { font-size: 11px; padding: 7px 12px; }
  .card-val { font-size: 22px; }
  /* Forcer toutes les cartes en colonne */
  .cards-grid { grid-template-columns: 1fr !important; }
  .reco-grid { grid-template-columns: 1fr !important; }
  /* Fix budget chart flex */
  .chart-box [style*="display:flex"] { flex-direction: column; }
  /* Fix adjust section ne dépasse jamais */
  .adjust-section { overflow: hidden; }
  .adjust-slider-wrap { max-width: 100%; }
}

/* PRINT */
@media print {
  body { background: white !important; color: #111 !important; }
  .bg-fx, .grain, .print-btn, .adjust-section { display: none !important; }
  .card, .chart-box, .insight, .reco-card { border-color: #ddd !important; background: #f9f9f9 !important; }
  .card-val, .score-val { color: #A06820 !important; }
  .wrap { max-width: 100%; }
}

/* LOADING */
.loading { text-align: center; padding: 80px 20px; color: var(--text3); }
.loading-spinner { width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg-fx"></div>
<div class="grain"></div>
<div class="wrap">

  <header>

function fmt(n) { return Math.round(n).toLocaleString('fr-FR') + ' €'; }
function fmtPct(n) { return (n * 100).toFixed(1) + '%'; }

function calcWealth(capital, epargne, rate, years) {
  const data = []; let val = capital;
  for (let y = 0; y <= years; y++) { data.push(Math.round(val)); val = val * (1 + rate) + epargne * 12; }
  return data;
}

function scorePatrimoine(capital, revenu, epargne, tauxEpargne) {
  let score = 0;

  // 1. TAUX D'ÉPARGNE — 20 pts max
  // Récompense la discipline, pas le montant absolu
  if (tauxEpargne >= 0.25)     score += 20;
  else if (tauxEpargne >= 0.15) score += 15;
  else if (tauxEpargne >= 0.10) score += 10;
  else if (tauxEpargne >= 0.05) score += 5;

  // 2. MATELAS DE SÉCURITÉ — 20 pts max
  // Capital / dépenses mensuelles estimées (revenus - épargne)
  const depenses = Math.max(1, revenu - epargne);
  const moisCouverture = capital / depenses;
  if (moisCouverture >= 6)      score += 20;
  else if (moisCouverture >= 3) score += 14;
  else if (moisCouverture >= 1) score += 7;

  // 3. CAPITAL INVESTI — 20 pts max
  // Progressif, accessible même avec peu
  if (capital >= 50000)      score += 20;
  else if (capital >= 20000) score += 16;
  else if (capital >= 10000) score += 12;
  else if (capital >= 5000)  score += 8;
  else if (capital >= 1000)  score += 4;

  // 4. CAPACITÉ D'INVESTISSEMENT MENSUELLE — 20 pts max
  // Montant absolu épargné chaque mois
  if (epargne >= 800)      score += 20;
  else if (epargne >= 400) score += 15;
  else if (epargne >= 200) score += 10;
  else if (epargne >= 50)  score += 5;

  // 5. RATIO CAPITAL / REVENUS ANNUELS — 20 pts max
  // Mesure si le patrimoine est à la hauteur du niveau de vie
  const revenusAnnuels = revenu * 12;
  const ratioCapital = capital / revenusAnnuels;
  if (ratioCapital >= 2)      score += 20;
  else if (ratioCapital >= 1) score += 15;
  else if (ratioCapital >= 0.5) score += 9;
  else if (ratioCapital >= 0.25) score += 4;

  return Math.min(100, score);
}

const EBOOK_URL   = 'https://drive.google.com/file/d/1uhUf_NzdhNdwtrXVp1emWcVmPvOCJguU/view?usp=sharing';
const CALENDLY_URL = 'https://calendly.com/sofianedidi15/un-investisseur-presque-parfait';

// Déclenché au clic sur un CTA Calendly — enregistre le lead dans MailerLite + Notion
async function onCalendlyClick() {
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email');
  if (!email) return;
  clearTimeout(_saveSimTimer);

  // Utiliser state (toujours à jour par les sliders) + DOM comme fallback
  const getVal = (id, stateVal) => {
    const el = document.getElementById(id);
    const domVal = el ? parseInt(el.value) : NaN;
    return (!isNaN(domVal) && domVal > 0) ? domVal : (stateVal || 0);
  };
  const revenu   = getVal('inp-revenu',   state.revenu);
  const epargne  = getVal('inp-epargne',  state.epargne);
  const capital  = getVal('inp-capital',  state.capital);
  const credit   = state.creditEnCours  || getVal('inp-credit',   0);
  const locatif  = state.revenuLocatif  || getVal('inp-locatif',  0);
  const conjoint = state.revenuConjoint || getVal('inp-conjoint', 0);

  const base = window.location.origin + window.location.pathname;
  const simUrl = base
    + '?source=tally'
    + '&email=' + encodeURIComponent(email)
    + '&prenom=' + encodeURIComponent(state.prenom || '')
    + '&personnage=' + encodeURIComponent(state.personnage || 'cdi')
    + '&capital=' + capital
    + '&risque=' + encodeURIComponent(state.risque || 'moderee')
    + '&objectif=' + encodeURIComponent(state.objectif || 'performance')
    + '&revenu=' + revenu
    + '&epargne=' + epargne
    + (credit  ? '&credit='   + credit   : '')
    + (locatif  ? '&locatif='  + locatif  : '')
    + (conjoint ? '&conjoint=' + conjoint : '')
    + (state.immoType ? '&immo=' + state.immoType : '');
  const GROUP_5K = '182059741376152834';
  // MailerLite — ÉTAPE 1 : mettre à jour sim_url d'abord
  try {
    const res1 = await fetch('https://connect.mailerlite.com/api/subscribers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ML_API_KEY, 'Accept': 'application/json' },
      body: JSON.stringify({ email, fields: {
        prenom:     state.prenom || '',
        capital:    String(capital),
        epargne:    String(epargne),
        revenu:     revenu,
        risque:     state.risque || 'moderee',
        personnage: state.personnage || 'cdi',
        credit:     credit,
        locatif:    locatif,
        conjoint:   conjoint,
        sim_url:    simUrl,
        immo_type:  state.immoType || 'rp'
      }})
    });
    const sub1 = await res1.json();
    const sid = sub1?.data?.id;
    if (sid) {
      // ÉTAPE 2 : retirer du groupe puis réajouter APRÈS que sim_url est enregistré
      try { await fetch('https://connect.mailerlite.com/api/subscribers/' + sid + '/groups/' + GROUP_5K, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + ML_API_KEY } }); } catch(e) {}
      // Attendre 3s pour que MailerLite propage bien les champs avant l'envoi
      await new Promise(r => setTimeout(r, 3000));
      // Vérifier que sim_url est bien mis à jour avant d'ajouter au groupe
      await fetch('https://connect.mailerlite.com/api/subscribers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ML_API_KEY, 'Accept': 'application/json' },
        body: JSON.stringify({ email, fields: { sim_url: simUrl, epargne: String(epargne), revenu: revenu } })
      });
      await new Promise(r => setTimeout(r, 1000));
      await fetch('https://connect.mailerlite.com/api/subscribers/' + sid + '/groups/' + GROUP_5K, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ML_API_KEY } });
    }
  } catch(e) {}
  // Notion via proxy — avec Lien Calendly + Simulation à jour
  try {
    const _calendlyUrl = CALENDLY_URL
      + '?utm_source=simulateur'
      + '&utm_medium=' + encodeURIComponent(state.prenom || 'prospect')
      + '&name=' + encodeURIComponent(state.prenom || '')
      + '&email=' + encodeURIComponent(email)
      + '&a2=' + encodeURIComponent(simUrl);
    await fetch('https://adc-proxy.sofiane-didi.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'upsertLead',
        email,
        fields: {
          prenom: state.prenom,
          capital: state.capital,
          epargne: state.epargne,
          cible: state.capital,
          simUrl,
          calendlyUrl: _calendlyUrl,
          simulationAJour: simUrl
        },
        dbId: NOTION_DB_LEADS_GLOBAL
      })
    });
  } catch(e) {}
}

  function getSuiviData(email) {
    // 1. Lire depuis localStorage
    let data = { email, versements: {}, cible, capital };
    try {

      if (raw) data = JSON.parse(raw);
    } catch(e) {}

    // 2. Fusionner avec les versements encodés dans l'URL (cross-device)
    try {
      const vParam = getURLParams().get('versements');
      if (vParam) {
        const versementsURL = {};
        vParam.split(',').forEach(entry => {
          const idx = entry.indexOf('=');
          if (idx > 0) {
            const k = entry.slice(0, idx);
            const v = parseFloat(entry.slice(idx + 1));
            if (k && !isNaN(v)) versementsURL[k] = v;
          }
        });
        // URL prioritaire sur localStorage si localStorage vide
        if (Object.keys(data.versements).length === 0 && Object.keys(versementsURL).length > 0) {
          data.versements = versementsURL;
          // Sauvegarder dans localStorage pour la prochaine fois
          try { localStorage.setItem(STORAGE_KEY_PREFIX + email, JSON.stringify(data)); } catch(e) {}
        }
      }
    } catch(e) {}

    return data;

  function _syncVersementsToURL(data) {

    const vStr = Object.entries(data.versements || {})

    if (vStr) params.set('versements', vStr);

  window.ajouterVersement = async function() {
    if (!_suiviEmail) return;
    const moisKey = document.getElementById('suivi-mois-sel').value;
    const montant = parseFloat(document.getElementById('suivi-montant').value);
    if (!montant || montant <= 0) return;

    // 1. Mettre à jour en local immédiatement
    const data = getSuiviData(_suiviEmail);
    data.versements[moisKey] = (data.versements[moisKey] || 0) + montant;
    saveSuiviData(data);
    document.getElementById('suivi-montant').value = '';

    // 2. Calculer le capital total
    const totalVerse   = Object.values(data.versements).reduce((s, v) => s + v, 0);
    const capitalTotal = (data.capital || 0) + totalVerse;
    const prenom       = data.prenom || state.prenom || 'Vous';

    // 3. Rafraîchir l'UI
    rafraichirSuivi(data);

    // 4. Sauvegarder dans Notion (source de vérité)
    if (true) {
      // Récupérer l'ID de la page lead pour la relation
      const leadPage = await notionFindLead(_suiviEmail);
      const leadPageId = leadPage?.id || null;

      // Sauvegarder le versement
      await notionSaveVersement(_suiviEmail, prenom, montant, capitalTotal, moisKey, leadPageId);

      // Mettre à jour le capital dans la page lead
      if (leadPageId) {
        await notionProxy('setStatut', { leadPageId, statut: '🟡 En cours', capital: capitalTotal });
      }

      // 5. Objectif atteint → basculer statut + groupe MailerLite
      if (capitalTotal >= (data.cible || 5000)) {
        afficherObjectifAtteint(capitalTotal);
        if (leadPageId) await notionSetStatut(leadPageId, '✅ Objectif atteint');
        await mlUpsertSubscriber(_suiviEmail, { prenom, capital: capitalTotal }, ML_GROUP_OBJECTIF);
        await mlRemoveFromGroup(_suiviEmail, ML_GROUP_LEADS);
      }
    }

    // 6. Mettre à jour MailerLite (capital + sim_url à jour)
    // Reconstruire sim_url avec le capital total mis à jour
    const _simParams = getURLParams();
    _simParams.set('capital', capitalTotal);
    _simParams.set('prenom', prenom);
    if (_simParams.get('email')) _simParams.set('source', 'email');
    const _simUrlUpdated = window.location.origin + window.location.pathname + '?' + _simParams.toString();
    mlUpsertSubscriber(_suiviEmail, {
      prenom,
      capital:  capitalTotal,
      objectif: data.cible || 5000,
      sim_url:  _simUrlUpdated
    }, ML_GROUP_LEADS);
  };

  window.supprimerVersement = async function(moisKey) {
    if (!_suiviEmail) return;

  (async function autoRestore() {
    const params = getURLParams();
    const emailUrl = params.get('email');
    if (!emailUrl) return;

    // Pré-remplir le champ email
    const emailField = document.getElementById('suivi-email');
    if (emailField) emailField.value = emailUrl;

    // Charger les versements depuis Notion

    const lead = await notionFindLead(emailUrl);
    const capitalDepart = lead?.properties?.['Capital départ']?.number || parseInt(params.get('capital')) || 0;
    const cible         = lead?.properties?.['Objectif cible']?.number || parseInt(params.get('objectif')) || 5000;
    const prenomNotion  = lead?.properties?.['Prénom']?.title?.[0]?.plain_text || params.get('prenom') || state.prenom || 'Vous';

    // Lire versements depuis l'URL si présents (persistance cross-device)
    const vParam = params.get('versements');
    const versementsURL = {};
    if (vParam) {
      vParam.split(',').forEach(entry => {
        const idx = entry.indexOf('=');
        if (idx > 0) {
          const k = entry.slice(0, idx);
          const v = parseFloat(entry.slice(idx + 1));
          if (k && !isNaN(v)) versementsURL[k] = v;
        }
      });
    }
    // Fusionner URL + localStorage + Notion (Notion prioritaire)
    const dataLocal = getSuiviData(emailUrl);
    const versementsFusionnes = Object.assign({}, versementsURL, dataLocal.versements, versementsNotion);

    // Si données trouvées (Notion ou localStorage) → afficher le suivi directement
    if (lead || Object.keys(versementsFusionnes).length > 0 || capitalDepart > 0) {
      const data = {
        email:      emailUrl,
        prenom:     prenomNotion,
        capital:    capitalDepart,
        cible:      cible,
        versements: versementsFusionnes,
      };
      saveSuiviData(data);
      try { localStorage.setItem('adc_suivi_last_email', emailUrl); } catch(e) {}
      renderSuiviActif(emailUrl);
    }
  })();

  // ── Initialisation directe du tracker ──
  if (document.getElementById('tracker-table'))
    document.getElementById('tracker-table').innerHTML = buildTracker(12);

  initSliders();
}

function initSliders() {
  ['sl-revenu', 'sl-epargne', 'sl-capital', 'sl-credit', 'sl-locatif', 'sl-conjoint'].forEach(id => {
    const el = document.getElementById(id);
    if (el) updateSliderTrack(el);
  });
}
function updateSliderTrack(el) {
  const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
  el.style.setProperty('--val', pct + '%');
}
/* ── DEBOUNCE ────────────────────────────────────────────────────── */
let _rerenderTimer = null;
function debouncedRerender() {
  if (_rerenderTimer) clearTimeout(_rerenderTimer);
  _rerenderTimer = setTimeout(() => {
    rerender();
    updateSimURL();
    setTimeout(() => updateCalendlyLinks(), 150);
  }, 300);
}

function getSimUrl() {
  // Construit l'URL avec les paramètres courants sans replaceState
  const params = new URLSearchParams();
  if (state.prenom) params.set('prenom', state.prenom);
  if (state.capital) params.set('capital', state.capital);
  if (state.revenu) params.set('revenu', state.revenu);
  if (state.epargne) params.set('epargne', state.epargne);
  if (state.creditEnCours) params.set('credit', state.creditEnCours);
  if (state.revenuLocatif) params.set('locatif', state.revenuLocatif);
  if (state.revenuConjoint) params.set('conjoint', state.revenuConjoint);
  if (state.risque) params.set('risque', state.risque);
  if (state.objectif) params.set('objectif', state.objectif);
  if (state.personnage) params.set('personnage', state.personnage);
  return window.location.origin + window.location.pathname + '?' + params.toString();
}

function updateCalendlyLinks() {
  const simUrl = getSimUrl();
  document.querySelectorAll('a[href*="calendly"]').forEach(a => {
    try {
      const u = new URL(CALENDLY_URL);
      u.searchParams.set('utm_source', 'simulateur');
      u.searchParams.set('utm_medium', state.prenom || 'prospect');
      u.searchParams.set('utm_content', simUrl);
      u.searchParams.set('name', state.prenom || '');
      // Pré-remplir email Calendly depuis l'URL
      const _emailParam = new URLSearchParams(window.location.search).get('email');
      if (_emailParam) u.searchParams.set('email', _emailParam);
      u.searchParams.set('a2', simUrl);
      a.href = u.toString();
    } catch(e) {}
  });
  // Sauvegarde Notion du lien simulateur (leads >= 5 000€ uniquement)
  if (state.capital >= 5000) _saveSimLinkToNotion(simUrl);
}

// Debounce 2s pour éviter les appels Notion trop fréquents
let _simLinkSaveTimer = null;
async function _saveSimLinkToNotion(simUrl) {
  if (_simLinkSaveTimer) clearTimeout(_simLinkSaveTimer);
  _simLinkSaveTimer = setTimeout(async () => {
    try {
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');
      if (!email) return;
      await notionProxy('upsertLead', {
        email,
        fields: {
          prenom:   state.prenom || 'Vous',
          capital:  state.capital,
          epargne:  state.epargne,
          cible:    state.capital >= 5000 ? state.capital : 5000,
          simUrl:   simUrl
        },
        dbId: NOTION_DB_LEADS_GLOBAL
      });
    } catch(e) { console.error('saveSimLink', e); }
  }, 2000);
}

// MutationObserver — met à jour les liens Calendly dès qu'ils apparaissent dans le DOM
(function initCalendlyObserver() {
  let _obsTimer = null;
  const observer = new MutationObserver(() => {
    if (_obsTimer) clearTimeout(_obsTimer);
    _obsTimer = setTimeout(() => {
      observer.disconnect(); // stop watching during update to avoid loop
      updateCalendlyLinks();
      observer.observe(document.body, { childList: true, subtree: true }); // resume
    }, 100);
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();

function renderImmoBlock(revenu, creditEnCours, capital, revenuLocatif, revenuConjoint) {
  revenuLocatif = revenuLocatif || 0;
  revenuConjoint = revenuConjoint || 0;
  const locatifRetenu = revenuLocatif * 0.7; // banques retiennent 70%
  const revenuTotal = revenu + locatifRetenu + revenuConjoint;
  const tauxMensuel = 0.035 / 12;
  const nMois20 = 240;
  const nMois25 = 300;
  const maxEndettement = revenuTotal * 0.35;
  const mensualiteImmoMax = Math.max(0, maxEndettement - creditEnCours);
  const capaciteImmo20 = mensualiteImmoMax * (1 - Math.pow(1 + tauxMensuel, -nMois20)) / tauxMensuel;
  const capaciteImmo25 = mensualiteImmoMax * (1 - Math.pow(1 + tauxMensuel, -nMois25)) / tauxMensuel;
  const apport = capital;

  // ── Frais d'acquisition ──
  // Sur le prix du bien estimé (budget crédit seul, avant frais)
  const fraisNotaire20 = capaciteImmo20 * 0.075;
  const fraisGarantie20 = capaciteImmo20 * 0.013; // hypothèque ~1.3% du capital emprunté
  const fraisDossier = 1200; // frais dossier bancaire moyen fixe
  const totalFrais20 = fraisNotaire20 + fraisGarantie20 + fraisDossier;

  const fraisNotaire25 = capaciteImmo25 * 0.075;
  const fraisGarantie25 = capaciteImmo25 * 0.013;
  const totalFrais25 = fraisNotaire25 + fraisGarantie25 + fraisDossier;

  // Budget net = crédit + apport - frais (ce qui reste pour le bien)
  const budgetNet20 = capaciteImmo20 + apport - totalFrais20;
  const budgetNet25 = capaciteImmo25 + apport - totalFrais25;

  const tauxEndetActuel = creditEnCours / revenuTotal * 100;

    ? `<div style="font-size:11px;color:var(--text3);margin-top:4px;">Revenus locatifs : ${Math.round(revenuLocatif).toLocaleString('fr-FR')} € × 70% = <strong style="color:var(--gold-light)">${Math.round(locatifRetenu).toLocaleString('fr-FR')} €</strong> retenus · revenu bancaire total : <strong style="color:#fff">${Math.round(revenuTotal).toLocaleString('fr-FR')} €</strong></div>`

              // BASE DU BIEN
              // On utilise la capacité d'emprunt 20 ans comme
              // prix d'achat FAI (frais d'agence inclus)
              // ══════════════════════════════════════════════
              const prixFAI = capaciteImmo20;              // prix affiché
              const apport  = capital;
              const montantEmprunte = prixFAI;             // on emprunte la capacité max, apport = frais

              // Base amortissable LMNP :
              // - terrain non amortissable : ~15% du prix net vendeur
              // - frais de notaire non amortissables
              // - mobilier : ~8% du prix (cuisine équipée, meubles)
              const prixNetVendeur  = prixFAI / 1.05;      // hors frais agence ~5%
              const terrain         = prixNetVendeur * 0.15;
              const baseAmortBien   = prixNetVendeur * 0.85;   // construction seule
              const baseAmortMob    = prixFAI * 0.08;          // mobilier ~8%

              // ══════════════════════════════════════════════
              // LOYER BRUT — on part de la mensualité crédit
              // Pour être autofinancé : loyer ≥ mensualité + charges
              // On cible rendement brut ≥ 7% (nécessaire en pratique)
              // ══════════════════════════════════════════════
              const rendCible = 0.07;  // 7% brut minimum pour autofinancement
              const loyerBrutCible = Math.round(prixFAI * rendCible / 12 / 10) * 10;
              const rendementBrut  = (loyerBrutCible * 12 / prixFAI * 100).toFixed(1);

              // ══════════════════════════════════════════════
              // CHARGES RÉELLES (mensualisées)
              // ══════════════════════════════════════════════
              const taxeFonciere    = Math.round(loyerBrutCible * 0.75 / 12); // ~0.75 mois de loyer/an → mensuel
              const assurancePNO    = Math.round(prixFAI * 0.002 / 12);    // 0.2%/an du prix
              const fraisGestion    = Math.round(loyerBrutCible * 0.075);  // 7.5% (agence gestion)
              const chargesTotal    = taxeFonciere + assurancePNO + fraisGestion;

              // ══════════════════════════════════════════════
              // AMORTISSEMENT LMNP AU RÉEL
              // Amortissement comptable ≠ décaissement cash
              // Il vient en déduction du résultat fiscal uniquement
              // ══════════════════════════════════════════════
              const amortBien     = Math.round(baseAmortBien * 0.025 / 12);  // 2.5%/an, durée 40 ans
              const amortMobilier = Math.round(baseAmortMob  * 0.10  / 12);  // 10%/an, durée 10 ans

              // Intérêts du crédit (déductibles) — année 1 : ~60% de la mensualité
              // diminue chaque année (tableau d'amortissement)
              const tauxMens = 0.035 / 12;
              const interetsAnnee1 = Math.round(montantEmprunte * tauxMens);  // première mensualité quasi 100% intérêts
              // On prend la moyenne sur 20 ans ≈ 35% de la mensualité
              const interetsMoyens = Math.round(mensualiteImmoMax * 0.35);

              // ── Résultat fiscal LMNP ──
              // Revenus : loyer brut
              // Déductions : charges + amortissements + intérêts
              const deductionsFiscales = chargesTotal + amortBien + amortMobilier + interetsMoyens;
              const resultatFiscal = loyerBrutCible - deductionsFiscales;
              // Si déficit : reportable sur BIC de même nature, pas d'impôt
              const impot = Math.max(0, resultatFiscal * 0.30);  // TMI 30% si bénéfice
              const fiscNul = resultatFiscal <= 0;
              const fiscaliteColor = fiscNul ? 'var(--green-light)' : 'var(--gold-light)';

              // ══════════════════════════════════════════════
              // CASHFLOW NET (trésorerie réelle, hors amortissement)
              // Amortissement = écriture comptable, pas de sortie cash
              // ══════════════════════════════════════════════
              const cashflow = loyerBrutCible - mensualiteImmoMax - chargesTotal - impot;
              const cfColor = cashflow >= 0 ? 'var(--green-light)' : cashflow >= -100 ? 'var(--gold-light)' : 'var(--red)';
              const cfLabel = cashflow >= 0 ? '✅ Autofinancé' : cashflow >= -100 ? '⚡ Quasi autofinancé' : '⚠️ Effort mensuel';

              // Effort net pour le propriétaire
              const effortNet = Math.max(0, -cashflow);

              // Richesse créée chaque mois (remboursement capital = épargne forcée)
              const capitalRembourse = mensualiteImmoMax - interetsMoyens;

              return `
              <!-- KPIs principaux — 3 col sur desktop, 1 col sur mobile -->

                </div>
                <div style="background:rgba(0,0,0,0.15);border-radius:7px;padding:8px 10px;">
                  <div style="font-size:9px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;">Impôt LMNP</div>
                  <div style="font-size:16px;font-weight:800;color:${fiscaliteColor};">${fiscNul ? '0 €' : '−'+Math.round(impot).toLocaleString('fr-FR')+' €'}</div>
                  <div style="font-size:9px;color:var(--text3);">${fiscNul ? 'déficit reportable' : 'résultat : +'+Math.round(resultatFiscal).toLocaleString('fr-FR')+' €'}</div>
                </div>
                <div style="background:rgba(0,0,0,0.15);border-radius:7px;padding:8px 10px;">
                  <div style="font-size:9px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;">Cashflow net</div>
                  <div style="font-size:16px;font-weight:800;color:${cfColor};">${cashflow >= 0 ? '+' : ''}${Math.round(cashflow).toLocaleString('fr-FR')} €</div>
                  <div style="font-size:9px;color:${cfColor};font-weight:700;">${cfLabel}</div>
                </div>
              </div>

              <!-- Décomposition — 2 blocs empilés sur mobile -->
              <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">

                <!-- Trésorerie réelle -->
                <div style="background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
                  <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">💸 Trésorerie réelle</div>
                  <div style="display:flex;flex-direction:column;gap:5px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                      <span style="color:var(--text2);">Loyer perçu</span>
                      <span style="color:var(--green-light);font-weight:700;white-space:nowrap;margin-left:8px;">+${Math.round(loyerBrutCible).toLocaleString('fr-FR')} €</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                      <span style="color:var(--text2);">Mensualité crédit</span>
                      <span style="color:var(--red);font-weight:700;white-space:nowrap;margin-left:8px;">−${Math.round(mensualiteImmoMax).toLocaleString('fr-FR')} €</span>

                      <span style="color:var(--text2);">Charges</span>
                      <span style="color:var(--red);font-weight:700;white-space:nowrap;margin-left:8px;">−${Math.round(chargesTotal).toLocaleString('fr-FR')} €</span>

                    </div>

                    </div>
                  </div>
                </div>

                <!-- Résultat fiscal LMNP -->
                <div style="background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
                  <div style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">📊 Résultat fiscal LMNP</div>
                  <div style="display:flex;flex-direction:column;gap:5px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                      <span style="color:var(--text2);">Loyer imposable</span>
                      <span style="color:var(--green-light);font-weight:700;white-space:nowrap;margin-left:8px;">+${Math.round(loyerBrutCible).toLocaleString('fr-FR')} €</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                      <span style="color:var(--text2);">Charges déductibles</span>
                      <span style="color:var(--text2);white-space:nowrap;margin-left:8px;">−${Math.round(chargesTotal).toLocaleString('fr-FR')} €</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                      <span style="color:var(--text2);">Intérêts crédit</span>
                      <span style="color:var(--text2);white-space:nowrap;margin-left:8px;">−${Math.round(interetsMoyens).toLocaleString('fr-FR')} €</span>

                    </div>
                    <div style="height:1px;background:var(--border);margin:3px 0;"></div>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;">

                  </div>
                </div>
              </div>

              <!-- Épargne forcée -->
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.2);border-radius:7px;margin-bottom:10px;">

              </div>`;
            })()}
          </div>

          <!-- CTA contextuel immo -->
          <div style="margin-top:14px;padding:12px 14px;background:linear-gradient(135deg,rgba(212,175,55,0.08),rgba(200,130,40,0.04));border:1px solid rgba(212,175,55,0.25);border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">

        })()}`}
    </div>`;
}

// ─── CHARTS ──────────────────────────────────────────────────────────────────
const GOLD = '#C8963E';
const GOLD_L = '#F0C060';
const GREEN = '#4ABA7A';
const BLUE = '#4A8FE8';
const RED = '#E05555';
const BG2 = '#1C1C1E';

function chartDefaults() {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { labels: { color: '#A0A8B4', font: { family: 'DM Sans', size: 11, weight: '500' } } },
      tooltip: { backgroundColor: '#1C1C1E', borderColor: '#2A2A2E', borderWidth: 1, titleColor: '#E8E8E8', bodyColor: '#A0A8B4', padding: 10 }
    },
    scales: {
      x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5A6070', font: { family: 'DM Sans', size: 10 } } },
      y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5A6070', font: { family: 'DM Sans', size: 10 }, callback: v => v >= 1000 ? (v/1000).toFixed(0)+'k €' : v+'€' } }
    }
  };
}

function drawBudgetChart(depenses, epargne) {
  const ctx = document.getElementById('chart-budget');
  if (!ctx) return;
  const total = depenses + epargne;
  const pctDepenses = Math.round(depenses / total * 100);
  const pctEpargne = Math.round(epargne / total * 100);
  charts['budget'] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: [`Dépenses (${pctDepenses}%)`, `Épargne (${pctEpargne}%)`],
      datasets: [{ data: [depenses, epargne], backgroundColor: [BLUE, GREEN], borderWidth: 0, hoverOffset: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#A0A8B4', font: { family: 'DM Sans', size: 11 }, padding: 12 } },
        tooltip: { backgroundColor: BG2, borderColor: '#2A2A2E', borderWidth: 1, titleColor: '#E8E8E8', bodyColor: '#A0A8B4', callbacks: { label: c => ' ' + fmt(c.parsed) + ' (' + Math.round(c.parsed/total*100) + '%)' } }
      },
      cutout: '65%'
    },
    plugins: [{
      id: 'centerText',
      afterDraw(chart) {
        const { ctx: c, chartArea: { left, right, top, bottom } } = chart;
        const cx = (left + right) / 2, cy = (top + bottom) / 2;
        c.save();
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = '#4ABA7A'; c.font = 'bold 14px DM Sans';
        c.fillText(pctEpargne + '%', cx, cy - 8);
        c.fillStyle = '#5A6070'; c.font = '10px DM Sans';
        c.fillText('épargné', cx, cy + 8);
        c.restore();
      }
    }]
  });
}

function drawWealthChart(data, dataMin, dataMax, years) {
  const ctx = document.getElementById('chart-wealth');
  if (!ctx) return;
  const labels = Array.from({length: years+1}, (_, i) => i === 0 ? 'Auj.' : `+${i}a`);
  charts['wealth'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Scénario central', data, borderColor: GOLD_L, backgroundColor: 'rgba(240,192,96,0.1)', borderWidth: 2, pointRadius: 0, tension: 0.4, fill: true },
        { label: 'Scénario prudent', data: dataMin, borderColor: BLUE, backgroundColor: 'transparent', borderWidth: 1, borderDash: [4,4], pointRadius: 0, tension: 0.4 },
        { label: 'Scénario optimiste', data: dataMax, borderColor: GREEN, backgroundColor: 'rgba(75,186,122,0.05)', borderWidth: 1, borderDash: [4,4], pointRadius: 0, tension: 0.4, fill: true },
      ]
    },
    options: chartDefaults()
  });
}

function drawCompoundChart(capital, epargne, rate, years) {
  const ctx = document.getElementById('chart-compound');
  if (!ctx) return;
  const labels = Array.from({length: years+1}, (_, i) => i === 0 ? 'Auj.' : `+${i}a`);
  const capitalInvesti = labels.map((_, i) => capital + epargne * 12 * i);
  const patrimoine = calcWealth(capital, epargne, rate, years);
  const interets = patrimoine.map((v, i) => Math.max(0, v - capitalInvesti[i]));

  const opts = chartDefaults();
  opts.scales.x.stacked = true;
  opts.scales.y.stacked = true;
  opts.plugins.tooltip.callbacks = {
    label: c => ' ' + c.dataset.label + ' : ' + fmt(Math.round(c.raw))
  };

  charts['compound'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Versements',
          data: capitalInvesti,
          backgroundColor: 'rgba(100,130,220,0.8)',
          borderColor: 'rgba(120,150,240,0.95)',
          borderWidth: 1,
          borderRadius: 4,
          borderSkipped: false
        },
        {
          label: 'Intérêts',
          data: interets,
          backgroundColor: 'rgba(210,160,60,0.85)',
          borderColor: 'rgba(230,180,70,0.95)',
          borderWidth: 1,
          borderRadius: 4,
          borderSkipped: false
        },
      ]
    },
    options: opts
  });
}

function drawMonthlyChart(capital, epargne, rate, years) {
  const ctx = document.getElementById('chart-monthly');
  if (!ctx) return;
  const labels = Array.from({length: years+1}, (_, i) => i === 0 ? 'Auj.' : `+${i}a`);
  const s0   = calcWealth(capital, 0, rate, years);
  const s50  = calcWealth(capital, Math.round(epargne*0.5), rate, years);

  charts['monthly'] = new Chart(ctx, {

          borderColor: 'rgba(90,96,112,0.8)',

          tension: 0.4,
          borderDash: [4,4],

          backgroundColor: 'transparent',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          borderDash: [4,4],
          fill: false
        },
        {
          label: `${fmt(epargne)}/mois`,
          data: s100,
          borderColor: GOLD_L,
          backgroundColor: 'rgba(240,192,96,0.08)',

          pointRadius: 0,

// ─── INSIGHTS ────────────────────────────────────────────────────────────────
function drawInsights(prenom, capital, revenu, epargne, tauxEpargne, score, finalVal, years, personnage, objectif, risque) {
  const insights = [];
  const recos = [];

  if (tauxEpargne >= 0.2) insights.push({ type:'good', icon:'💪', text:`<strong>${prenom} épargne ${fmtPct(tauxEpargne)} de ses revenus</strong> — c'est excellent. La majorité des Français épargnent moins de 10%. Une discipline financière solide est en place.` });
  else if (tauxEpargne >= 0.1) insights.push({ type:'warn', icon:'📈', text:`<strong>Taux d'épargne de ${fmtPct(tauxEpargne)}</strong> — correct mais optimisable. En réduisant les dépenses de 100–200 €/mois, l'impact sur 10 ans est massif.` });
  else insights.push({ type:'warn', icon:'⚠️', text:`<strong>Taux d'épargne de ${fmtPct(tauxEpargne)}</strong> — faible. La priorité n°1 est d'identifier les fuites budgétaires et d'automatiser l'épargne avant toute chose.` });

  if (capital >= revenu * 6) insights.push({ type:'good', icon:'🏆', text:`<strong>Matelas de sécurité solide</strong> — ${prenom} dispose de plus de 6 mois de revenus en capital. Les placements moyen terme peuvent être envisagés avec sérénité.` });
  else if (capital < revenu * 2) insights.push({ type:'warn', icon:'🛡️', text:`<strong>Capital de départ modeste</strong> (${fmt(capital)}) — avant d'investir agressivement, il est conseillé de constituer un fonds de précaution de 3–6 mois de revenus.` });

  insights.push({ type:'info', icon:'🔮', text:`Sur <strong>${years} ans</strong>, ton patrimoine peut atteindre <strong>${fmt(finalVal)}</strong>. C'est <strong>${Math.round(finalVal/capital)}× ton capital de départ</strong> — uniquement grâce aux intérêts composés et à la discipline d'épargne.` });

  if (personnage === 'independant' || personnage === 'chef') {
    insights.push({ type:'info', icon:'💼', text:`<strong>Profil entrepreneur</strong> — avec une holding ou un PER, tu peux déduire jusqu'à <strong>${fmt(Math.round(Math.min(revenu * 0.10 * 12, 35194)))}/an</strong> de tes revenus imposables. C'est de l'argent investi au lieu d'être taxé.` });
  }
  if (personnage === 'etudiant') {
    insights.push({ type:'good', icon:'⏰', text:`<strong>Ton âge est ton meilleur actif</strong> — ${fmt(epargne || 100)}/mois investis pendant 20 ans = <strong>${fmt(Math.round((epargne || 100) * 12 * (Math.pow(1.07, 20) - 1) / 0.07))}</strong> à 7%/an. Commencer à 25 ans vs 35 ans double le capital final.` });
  }

  // Épargne de précaution
  const precaution = revenu * 3;
  const precautionIdeal = revenu * 6;
  if (capital < precaution) {
    recos.push({ title: '🛡️ Épargne de précaution PRIORITAIRE', text: `Avant tout investissement, constituez ${fmt(precaution)} à ${fmt(precautionIdeal)} sur un Livret A ou LDDS (objectif : 3–6 mois de revenus). Ce matelas sécurisé vous protège des aléas et évite de vendre vos placements en urgence.`, type: 'urgent' });
  } else {
    recos.push({ title: '✅ Épargne de précaution OK', text: `Votre matelas de sécurité est en place. Maintenez ${fmt(precaution)} à ${fmt(precautionIdeal)} liquides sur Livret A/LDDS et investissez le surplus sereinement.`, type: 'good' });
  }
  // Portefeuille équilibré
  const alloc = risque === 'elevee' 
    ? { actions: '60%', immo: '20%', oblig: '15%', cash: '5%', label: 'Dynamique' }
    : risque === 'faible' 
    ? { actions: '10%', immo: '15%', oblig: '60%', cash: '15%', label: 'Prudent' }
    : { actions: '40%', immo: '20%', oblig: '30%', cash: '10%', label: 'Équilibré' };
  recos.push({ title: '🏦 Enveloppe fiscale — combien tu peux économiser', text: risque === 'faible'
    ? `Livret A (3%) + Assurance-vie fonds euros. Sur ${fmt(capital)} investis, un PER peut te faire économiser jusqu'à <strong>${fmt(Math.round(capital * 0.11))}</strong> d'impôts dès cette année (TMI 11%).`
    : objectif === 'retraite'
    ? `PER (Plan Épargne Retraite) : déductible des revenus. Sur ${fmt(epargne * 12)}/an versés, <strong>${fmt(Math.round(epargne * 12 * 0.30))}</strong> d'impôts récupérés si TMI 30%.`
    : `PEA (exonération totale après 5 ans) + Assurance-vie UC. <strong>0% d'impôt</strong> sur les plus-values après 5 ans sur PEA — sur ${fmt(capital)} investis à 8%/an, ça représente <strong>${fmt(Math.round(capital * 0.08 * 5 * 0.30))}</strong> d'impôts évités sur 5 ans.` });
  recos.push({ title: '📅 Automatiser = +43% de patrimoine en moyenne', text: `Programmez un virement de <strong>${fmt(epargne)}</strong> le jour de paie. Les épargnants qui automatisent accumulent 43% de patrimoine supplémentaire vs ceux qui épargnent "ce qui reste".` });
  recos.push({ title: `🎯 Chaque mois d'attente = ${fmt(Math.round(capital * RISQUE_RATES[risque].mid / 12))} perdu`, text: `Investir ${fmt(capital)} maintenant vs dans 6 mois = <strong>${fmt(Math.round(capital * RISQUE_RATES[risque].mid / 12 * 6))}</strong> de rendement manqué. L'effet de l'inaction se mesure en euros réels.` });

  const ib = document.getElementById('insights-box');
  const rb = document.getElementById('reco-box');
  if (ib) ib.innerHTML = insights.map(i => `<div class="insight ${i.type}"><span class="insight-icon">${i.icon}</span><span class="insight-text">${i.text}</span></div>`).join('');
  if (rb) rb.innerHTML = recos.map(r => {
    const border = r.type === 'urgent' ? 'border-color:rgba(224,85,85,0.4);background:rgba(224,85,85,0.05)' : r.type === 'good' ? 'border-color:rgba(75,186,122,0.3);background:rgba(75,186,122,0.04)' : '';
    return `<div class="reco-card" style="${border}"><h5>${r.title}</h5><p>${r.text}</p></div>`;
  }).join('');
}

function toggleModifier() {
  const panel = document.getElementById('modifier-panel');
  if (panel) {
    panel.remove();
    document.getElementById('btn-modifier').textContent = '✏️ Modifier ma simulation';
    return;
  }
  _showModifierPanel();
}

function _showSaveFeedback(msg, color) {
  let el = document.getElementById('mod-save-feedback');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color || 'var(--green-light)';
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => { el.style.opacity = '0'; }, 3500);
}

function applyModif(force) {
  const p = document.getElementById('mod-prenom');
  const c = document.getElementById('mod-capital');
  const per = document.getElementById('mod-personnage');
  const ri = document.getElementById('mod-risque');
  const ob = document.getElementById('mod-objectif');
  if (!p) return;
  const newPersonnage = per.value;
  const profil = PROFILS[newPersonnage] || PROFILS['cdi'];
  state.prenom = p.value || 'Le candidat';
  state.capital = Math.max(0, parseInt(c.value) || 0);
  state.personnage = newPersonnage;
  state.risque = ri.value;
  state.objectif = ob.value;

  render();
  // updateSimURL après que render() ait fini (render a un setTimeout interne de 50ms)
  setTimeout(() => {
    updateSimURL();
    updateCalendlyLinks();
    // Afficher le feedback de sauvegarde si email présent

      _showModifierPanel();

  }, 80);
}

// ─── INSCRIPTION MAILERLITE DEPUIS LE SIMULATEUR ─────────────────────────────
async function registerToMailerLite(email, data) {
  const MAILERLITE_API_KEY = ML_API_KEY;

  // IDs des groupes MailerLite
  const GROUPS = {
    court:    '182024263602013505', // 1-6 mois
    moyen:    '182024267133618164', // 7-12 mois
    long:     '182024270374766345', // 13-24 mois
    objectif: '182025250594096661', // objectif atteint
    analyse:  '182059741376152834', // leads ≥ 5k analyse patrimoniale
  };

  // Calcul de l'horizon
  const capital  = parseInt(data.capital)  || 0;
  const epargne  = parseInt(data.epargne)  || 1;
  const objectif = parseInt(data.objectif) || 5000;
  const manque   = Math.max(0, objectif - capital);
  const horizon  = manque <= 0 ? 0 : Math.ceil(manque / epargne);

  // URL de simulation = l'URL complète de la page (contient toutes les vraies données Tally)
  const simUrl = window.location.href;

  // Leads ≥ 5k → NE PAS inscrire ici — onCalendlyClick s'en charge au clic CTA
  // Leads < 5k → groupe selon horizon épargne
  if (capital >= 5000) return; // ≥5k géré par onCalendlyClick

  let groupId;
  if (horizon <= 0)       groupId = GROUPS.objectif;
  else if (horizon <= 6)  groupId = GROUPS.court;
  else if (horizon <= 12) groupId = GROUPS.moyen;
  else                    groupId = GROUPS.long;

  // Appel direct MailerLite — 0 crédit Netlify consommé
  try {
    const mlBody = { email, fields: { prenom: data.prenom || '', capital: String(capital), epargne: String(epargne), objectif: String(objectif), sim_url: simUrl } };
    const mlRes = await fetch('https://connect.mailerlite.com/api/subscribers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ML_API_KEY, 'Accept': 'application/json' },
      body: JSON.stringify(mlBody)
    });
    const mlData = await mlRes.json();
    const sid = mlData?.data?.id;
    if (sid) {
      // Retirer puis réajouter pour déclencher l'automation même si déjà subscriber
      if (capital >= 5000) {
        try { await fetch('https://connect.mailerlite.com/api/subscribers/' + sid + '/groups/' + groupId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + ML_API_KEY, 'Accept': 'application/json' } }); } catch(e) {}
      }
      await fetch('https://connect.mailerlite.com/api/subscribers/' + sid + '/groups/' + groupId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ML_API_KEY, 'Accept': 'application/json' }
      });
    }
  } catch(e) {}

  // Notion — 1 seul appel Function uniquement si capital >= 5k (lead chaud)
  if (capital >= 5000) {
    try {
      await fetch('https://adc-proxy.sofiane-didi.workers.dev', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'upsertLead', email, fields: { prenom: data.prenom || 'Vous', capital, epargne, cible: objectif, simUrl }, dbId: NOTION_DB_LEADS_GLOBAL })
      });
    } catch(e) {}
  }
}
